name: Collect traffic

on:
  schedule:
    - cron: "17 0 * * *" # daily 00:17 UTC (09:17 JST)
  workflow_dispatch:

permissions:
  contents: write
  actions: write # keep the schedule enabled (see the last step)

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Collected data lives on the "data" branch so the daily bot commits stay
      # off main (and out of commit notifications for the default branch).
      - name: Ensure data branch exists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --heads origin data >/dev/null; then
            init=$(git commit-tree "$(git hash-object -t tree /dev/null)" -m "Initialize data branch")
            git push origin "${init}:refs/heads/data"
          fi

      - uses: actions/checkout@v7
        with:
          ref: data
          path: data-branch

      - name: Issue GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ vars.TRAFFIC_OWNER || github.repository_owner }}

      - name: Fetch traffic
        id: fetch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TRAFFIC_OWNER: ${{ vars.TRAFFIC_OWNER || github.repository_owner }}
          TRAFFIC_REPOS: ${{ vars.TRAFFIC_REPOS }}
          INCLUDE_PRIVATE: ${{ vars.INCLUDE_PRIVATE }}
          INCLUDE_FORKS: ${{ vars.INCLUDE_FORKS }}
          DATA_DIR: data-branch/data
        run: python3 scripts/fetch_traffic.py

      - name: Commit data
        working-directory: data-branch
        run: |
          git add data
          git diff --cached --quiet || git commit -m "data: traffic $(date -u +%F)"
          git pull --rebase origin data
          git push origin data

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data-branch/data _site/data

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # GitHub disables schedules in public repos after 60 days without activity;
      # re-enabling on every run keeps it from ever expiring.
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/traffic.yml/enable"

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
