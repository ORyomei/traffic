<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repository Traffic</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1><span id="owner">GitHub</span> traffic</h1>
      <p class="muted" id="updated">読み込み中…</p>
    </header>

    <div class="filters">
      <label>
        <span>リポジトリ</span>
        <select id="repo"><option value="">すべて</option></select>
      </label>
      <div class="segmented" id="range" role="group" aria-label="期間">
        <button data-days="30">30日</button>
        <button data-days="90" aria-pressed="true">90日</button>
        <button data-days="365">1年</button>
        <button data-days="0">全期間</button>
      </div>
    </div>

    <section class="tiles">
      <div class="tile"><span class="label">Views</span><span class="value" id="kpi-views">–</span></div>
      <div class="tile"><span class="label">Unique visitors<sup>*</sup></span><span class="value" id="kpi-views-u">–</span></div>
      <div class="tile"><span class="label">Clones</span><span class="value" id="kpi-clones">–</span></div>
      <div class="tile"><span class="label">Unique cloners<sup>*</sup></span><span class="value" id="kpi-clones-u">–</span></div>
    </section>
    <p class="note muted">* 日ごとのユニーク数の合計（期間全体での重複は除外されません）</p>

    <section class="card">
      <h2>Views / 日</h2>
      <div class="chart"><canvas id="chart-views" role="img" aria-label="日別ビュー数"></canvas></div>
    </section>
    <section class="card">
      <h2>Clones / 日</h2>
      <div class="chart"><canvas id="chart-clones" role="img" aria-label="日別クローン数"></canvas></div>
    </section>

    <section class="card">
      <h2>リポジトリ別 <span class="muted small">（選択期間）</span></h2>
      <div class="table-wrap">
        <table id="repo-table">
          <thead><tr>
            <th data-key="name">Repository</th>
            <th data-key="views" class="num">Views</th>
            <th data-key="viewsU" class="num">Unique</th>
            <th data-key="clones" class="num">Clones</th>
            <th data-key="clonesU" class="num">Unique</th>
            <th class="spark-h">Views</th>
            <th class="spark-h">Clones</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <div class="pair">
      <section class="card">
        <h2>Referrers <span class="muted small">（直近14日）</span></h2>
        <div class="table-wrap"><table id="referrers"><thead><tr>
          <th>Source</th><th class="num">Views</th><th class="num">Unique</th>
        </tr></thead><tbody></tbody></table></div>
      </section>
      <section class="card">
        <h2>Popular content <span class="muted small">（直近14日）</span></h2>
        <div class="table-wrap"><table id="paths"><thead><tr>
          <th>Path</th><th class="num">Views</th><th class="num">Unique</th>
        </tr></thead><tbody></tbody></table></div>
      </section>
    </div>
  </main>
</body>
</html>
